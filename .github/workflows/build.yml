name: Build LLVM

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        type: choice
        options:
          - aarch64
          - x86_64
        default: 'aarch64'
      os:
        description: 'Target OS'
        required: true
        type: choice
        options:
          - linux
          - macos
        default: 'linux'
      release_tag:
        description: 'Release tag name'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release title'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Additional release notes'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions: write-all
    runs-on: ${{ inputs.os == 'macos' && 'macos-latest' || (inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    container: ${{ inputs.os == 'linux' && 'debian:12' || '' }}

    steps:
      - name: Install system dependencies
        if: inputs.os == 'linux'
        run: |
          apt-get update
          apt-get install -y build-essential clang cmake tar zstd gh git

      - name: Install system dependencies (macOS)
        if: inputs.os == 'macos'
        run: |
          brew install cmake zstd gh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build permissions
        run: chmod +x build-llvm.sh

      - name: Build LLVM
        run: BUILD_JOBS=$(sysctl -n hw.ncpu 2>/dev/null || nproc) ./build-llvm.sh

      - name: Prepare build artifacts
        run: |
          cd build
          tar --zstd -cf ../llvm.tar.zst *
          cd ..

      - name: Generate checksum
        run: |
          if [ "${{ inputs.os }}" = "macos" ]; then
            shasum -a 256 llvm.tar.zst > llvm.tar.zst.sig
          else
            sha256sum llvm.tar.zst > llvm.tar.zst.sig
          fi

      - name: Configure git
        run: git config --global --add safe.directory "$(realpath .)"

      - name: Set release variables
        id: release_vars
        run: |
          RELEASE_TAG="${{ inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="build-${{ github.sha }}"
          fi
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          RELEASE_TITLE="${{ inputs.release_title }}"
          if [ -z "$RELEASE_TITLE" ]; then
            RELEASE_TITLE="$RELEASE_TAG"
          fi
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT

          SHA256=$(cat llvm.tar.zst.sig)
          RELEASE_NOTES="LLVM build (commit: ${{ github.sha }}, arch: ${{ inputs.arch }}, os: ${{ inputs.os }})"
          RELEASE_NOTES="$RELEASE_NOTES\n\nSHA256: $SHA256"
          if [ -n "${{ inputs.release_notes }}" ]; then
            RELEASE_NOTES="$RELEASE_NOTES\n\n${{ inputs.release_notes }}"
          fi
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.draft }}" = "true" ]; then
            gh release create "${{ steps.release_vars.outputs.release_tag }}" \
              --title "${{ steps.release_vars.outputs.release_title }}" \
              --notes "${{ steps.release_vars.outputs.release_notes }}" \
              llvm.tar.zst llvm.tar.zst.sig \
              --target ${{ github.sha }} \
              --draft
          else
            gh release create "${{ steps.release_vars.outputs.release_tag }}" \
              --title "${{ steps.release_vars.outputs.release_title }}" \
              --notes "${{ steps.release_vars.outputs.release_notes }}" \
              llvm.tar.zst llvm.tar.zst.sig \
              --target ${{ github.sha }}
          fi
